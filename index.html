document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

F\",w:3,ar:\"3–14\"},\n    \"San Francisco 49ers\":{a:\"SF\",cf:\"NFC\",rg:\"West\",c:\"#AA0000\",w:12,ar:\"12–5\"}\n  };\n  REGIONS = [\"East\",\"North\",\"South\",\"West\"];\n  MVP_SUGGESTIONS = [\"Patrick Mahomes\",\"Josh Allen\",\"Joe Burrow\",\"Lamar Jackson\",\"Justin Herbert\",\"Jayden Daniels\",\"Jalen Hurts\",\"Dak Prescott\",\"Jared Goff\",\"Brock Purdy\",\"Baker Mayfield\",\"Bo Nix\",\"Jordan Love\",\"Caleb Williams\",\"Ja'Marr Chase\",\"Justin Jefferson\",\"Saquon Barkley\",\"Bijan Robinson\",\"Christian McCaffrey\",\"Micah Parsons\",\"Myles Garrett\",\"T.J. Watt\"];\n  KEY = \"nfl_predictor_dc_v3\";\n\n  state = {\n    seasonYear: 2026,\n    wins: {},\n    playoffs: { AFC: [], NFC: [] },\n    champs: { AFC: \"\", NFC: \"\" },\n    sbWinner: \"\",\n    awards: { mvp: \"\", opoy: \"\", dpoy: \"\", roty: \"\", coy: \"\" },\n    locked: false,\n    showCompare: true,\n    loaded: false\n  };\n\n  componentDidMount() {\n    let next = null;\n    try {\n      const raw = localStorage.getItem(this.KEY);\n      if (raw) next = JSON.parse(raw);\n    } catch (e) {}\n    if (next) {\n      this.setState({\n        seasonYear: Number(next.seasonYear) || this.props.season || 2026,\n        wins: next.wins || {},\n        playoffs: { AFC: (next.playoffs?.AFC || []), NFC: (next.playoffs?.NFC || []) },\n        champs: { AFC: next.champs?.AFC || \"\", NFC: next.champs?.NFC || \"\" },\n        sbWinner: next.sbWinner || \"\",\n        awards: Object.assign({ mvp:\"\",opoy:\"\",dpoy:\"\",roty:\"\",coy:\"\" }, next.awards || {}),\n        locked: !!next.locked,\n        showCompare: next.showCompare !== undefined ? next.showCompare : (this.props.showActuals !== false),\n        loaded: true\n      });\n    } else {\n      this.setState({\n        seasonYear: this.props.season || 2026,\n        showCompare: this.props.showActuals !== false,\n        loaded: true\n      });\n    }\n  }\n\n  save(s) {\n    const st = s || this.state;\n    try {\n      localStorage.setItem(this.KEY, JSON.stringify({\n        seasonYear: st.seasonYear, wins: st.wins, playoffs: st.playoffs,\n        champs: st.champs, sbWinner: st.sbWinner, awards: st.awards,\n        locked: st.locked, showCompare: st.showCompare\n      }));\n    } catch (e) {}\n  }\n  commit(patch) {\n    this.setState(prev => { const ns = Object.assign({}, prev, patch); this.save(ns); return ns; });\n  }\n\n  getWins(team) { const w = this.state.wins[team]; return w === undefined ? this.META[team].w : w; }\n\n  teamsOf(conf) { return Object.keys(this.META).filter(t => this.META[t].cf === conf); }\n  divisionTeams(conf, region) {\n    return this.teamsOf(conf).filter(t => this.META[t].rg === region)\n      .sort((x, y) => this.getWins(y) - this.getWins(x) || this.META[y].w - this.META[x].w || x.localeCompare(y));\n  }\n  // standings rank across conference (for wildcard ordering): div winners then rest by wins\n  confStandings(conf) {\n    const winners = [], rest = [];\n    this.REGIONS.forEach(rg => { const d = this.divisionTeams(conf, rg); winners.push(d[0]); rest.push(...d.slice(1)); });\n    winners.sort((x, y) => this.getWins(y) - this.getWins(x) || this.META[y].w - this.META[x].w);\n    rest.sort((x, y) => this.getWins(y) - this.getWins(x) || this.META[y].w - this.META[x].w);\n    return { winners, wildcards: rest };\n  }\n\n  setWins(team, delta) {\n    if (this.state.locked) return;\n    this.setState(prev => {\n      const cur = prev.wins[team] === undefined ? this.META[team].w : prev.wins[team];\n      const nv = Math.max(0, Math.min(17, cur + delta));\n      const ns = Object.assign({}, prev, { wins: Object.assign({}, prev.wins, { [team]: nv }) });\n      this.save(ns); return ns;\n    });\n  }\n\n  togglePlayoff(conf, team) {\n    if (this.state.locked) return;\n    this.setState(prev => {\n      const list = prev.playoffs[conf].slice();\n      const i = list.indexOf(team);\n      if (i >= 0) list.splice(i, 1);\n      else { if (list.length >= 7) return prev; list.push(team); }\n      const champs = Object.assign({}, prev.champs);\n      if (!list.includes(champs[conf])) champs[conf] = \"\";\n      let sb = prev.sbWinner;\n      if (sb && !list.includes(sb) && (sb === prev.champs[conf])) sb = \"\";\n      const ns = Object.assign({}, prev, { playoffs: Object.assign({}, prev.playoffs, { [conf]: list }), champs, sbWinner: sb });\n      this.save(ns); return ns;\n    });\n  }\n\n  autoFill(conf) {\n    if (this.state.locked) return;\n    const { winners, wildcards } = this.confStandings(conf);\n    const seeds = winners.concat(wildcards.slice(0, 3));\n    this.commit({ playoffs: Object.assign({}, this.state.playoffs, { [conf]: seeds }) });\n  }\n\n  moveSeed(conf, idx, delta) {\n    if (this.state.locked) return;\n    this.setState(prev => {\n      const list = prev.playoffs[conf].slice();\n      const t = idx + delta;\n      if (t < 0 || t >= list.length) return prev;\n      [list[idx], list[t]] = [list[t], list[idx]];\n      const ns = Object.assign({}, prev, { playoffs: Object.assign({}, prev.playoffs, { [conf]: list }) });\n      this.save(ns); return ns;\n    });\n  }\n\n  reset() {\n    const fresh = {\n      seasonYear: this.state.seasonYear, wins: {}, playoffs: { AFC: [], NFC: [] },\n      champs: { AFC: \"\", NFC: \"\" }, sbWinner: \"\", awards: { mvp:\"\",opoy:\"\",dpoy:\"\",roty:\"\",coy:\"\" },\n      locked: false, showCompare: this.state.showCompare, loaded: true\n    };\n    this.setState(fresh); this.save(fresh);\n  }\n\n  // ---- builders ----\n  shade(hex, amt) {\n    const h = hex.replace('#',''); let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);\n    r=Math.round(r+(255-r)*amt); g=Math.round(g+(255-g)*amt); b=Math.round(b+(255-b)*amt);\n    return `rgb(${r}, ${g}, ${b})`;\n  }\n  buildTeamRow(team, rank, highlight) {\n    const m = this.META[team], w = this.getWins(team), l = 17 - w, d = w - m.w;\n    const isWinner = highlight && rank === 1;\n    const deltaText = d === 0 ? \"±0\" : (d > 0 ? \"+\" + d : \"\" + d);\n    return {\n      name: team, abbr: m.a, color: m.c, rank,\n      rankColor: isWinner ? m.c : \"#aab0bb\",\n      rowBg: isWinner ? this.shade(m.c, 0.93) : \"#ffffff\",\n      isWinner,\n      recordText: w + \"–\" + l,\n      barWidth: Math.round((w / 17) * 100) + \"%\",\n      actualText: m.ar || (m.w + \"–\" + (17 - m.w)),\n      deltaText,\n      deltaColor: d > 0 ? \"#1f9d54\" : (d < 0 ? \"#c8102e\" : \"#9aa1ad\"),\n      onInc: () => this.setWins(team, 1),\n      onDec: () => this.setWins(team, -1)\n    };\n  }\n  buildDivisions(conf, highlight) {\n    return this.REGIONS.map(rg => {\n      const teams = this.divisionTeams(conf, rg);\n      return { region: rg, teams: teams.map((t, i) => this.buildTeamRow(t, i + 1, highlight)) };\n    });\n  }\n  buildChips(conf) {\n    const active = this.state.playoffs[conf];\n    const order = [];\n    this.REGIONS.forEach(rg => order.push(...this.divisionTeams(conf, rg)));\n    return order.map(team => {\n      const m = this.META[team], on = active.includes(team);\n      return {\n        label: m.a, dot: m.c,\n        bg: on ? m.c : \"#faf9f5\",\n        fg: on ? \"#ffffff\" : \"#3a4151\",\n        border: on ? m.c : \"#e6e3db\",\n        onClick: () => this.togglePlayoff(conf, team)\n      };\n    });\n  }\n  buildSeeds(conf) {\n    const list = this.state.playoffs[conf];\n    return list.map((team, i) => {\n      const m = this.META[team];\n      return {\n        seed: i + 1, name: team, color: m.c,\n        seedColor: i === 0 ? (conf === \"AFC\" ? \"#c8102e\" : \"#0b3d91\") : \"#2a3140\",\n        rowBg: i === 0 ? \"#faf9f5\" : \"#ffffff\",\n        note: i === 0 ? \"BYE\" : (i <= 3 ? \"Host\" : \"Wild Card\"),\n        onUp: () => this.moveSeed(conf, i, -1),\n        onDown: () => this.moveSeed(conf, i, 1),\n        upDisabled: i === 0 || this.state.locked,\n        downDisabled: i === list.length - 1 || this.state.locked\n      };\n    });\n  }\n\n  renderVals() {\n    const s = this.state, hi = this.props.highlightWinners !== false;\n    const afcChamp = s.champs.AFC, nfcChamp = s.champs.NFC;\n    const sbOpts = (afcChamp && nfcChamp) ? [afcChamp, nfcChamp] : [];\n    const colorOf = t => t ? this.META[t].c : \"rgba(255,255,255,.14)\";\n\n    return {\n      seasonYear: s.seasonYear,\n      locked: s.locked,\n      showCompare: s.showCompare,\n\n      afcDivisions: this.buildDivisions(\"AFC\", hi),\n      nfcDivisions: this.buildDivisions(\"NFC\", hi),\n\n      afcChips: this.buildChips(\"AFC\"),\n      nfcChips: this.buildChips(\"NFC\"),\n      afcCount: s.playoffs.AFC.length,\n      nfcCount: s.playoffs.NFC.length,\n      afcCountColor: s.playoffs.AFC.length === 7 ? \"#1f9d54\" : \"#c8102e\",\n      nfcCountColor: s.playoffs.NFC.length === 7 ? \"#1f9d54\" : \"#c8102e\",\n\n      afcSeeds: this.buildSeeds(\"AFC\"),\n      nfcSeeds: this.buildSeeds(\"NFC\"),\n      afcSeedsEmpty: s.playoffs.AFC.length === 0,\n      nfcSeedsEmpty: s.playoffs.NFC.length === 0,\n\n      afcChamp, nfcChamp, sbWinner: s.sbWinner,\n      afcChampOptions: s.playoffs.AFC,\n      nfcChampOptions: s.playoffs.NFC,\n      sbOptions: sbOpts,\n      afcChampPlaceholder: s.playoffs.AFC.length === 7 ? \"— pick AFC champ —\" : \"— pick 7 AFC teams first —\",\n      nfcChampPlaceholder: s.playoffs.NFC.length === 7 ? \"— pick NFC champ —\" : \"— pick 7 NFC teams first —\",\n      sbPlaceholder: sbOpts.length ? \"— pick the winner —\" : \"— set both champions first —\",\n\n      mvp: s.awards.mvp, opoy: s.awards.opoy, dpoy: s.awards.dpoy, roty: s.awards.roty, coy: s.awards.coy,\n      mvpSuggestions: this.MVP_SUGGESTIONS,\n\n      // hero\n      heroAfcName: afcChamp || \"AFC TBD\",\n      heroAfcColor: colorOf(afcChamp),\n      heroNfcName: nfcChamp || \"NFC TBD\",\n      heroNfcColor: colorOf(nfcChamp),\n      heroWinnerName: s.sbWinner || \"Make your pick\",\n      heroWinnerColor: s.sbWinner ? this.META[s.sbWinner].c : \"rgba(255,255,255,.3)\",\n      heroWinnerBg: s.sbWinner ? this.shade(this.META[s.sbWinner].c, -0) : \"rgba(255,255,255,.06)\",\n\n      // header toggles\n      lockLabel: s.locked ? \"Locked\" : \"Unlocked\",\n      lockBg: s.locked ? \"#c8102e\" : \"transparent\",\n      compareLabel: s.showCompare ? \"On\" : \"Off\",\n      compareBg: s.showCompare ? \"#1f2a47\" : \"transparent\",\n      compareBorder: s.showCompare ? \"#3a4a73\" : \"#2a3350\",\n      compareColor: \"#fff\",\n\n      // handlers\n      onSeasonYear: e => { const y = Number(e.target.value); if (y >= 2000 && y <= 2099) this.commit({ seasonYear: y }); },\n      onToggleCompare: () => this.commit({ showCompare: !s.showCompare }),\n      onToggleLock: () => this.commit({ locked: !s.locked }),\n      onPrint: () => window.print(),\n      onReset: () => { if (window.confirm(\"Reset all predictions?\")) this.reset(); },\n      onAutoAfc: () => this.autoFill(\"AFC\"),\n      onAutoNfc: () => this.autoFill(\"NFC\"),\n      onAfcChamp: e => this.commit({ champs: Object.assign({}, s.champs, { AFC: e.target.value }), sbWinner: (s.sbWinner === s.champs.AFC ? \"\" : s.sbWinner) }),\n      onNfcChamp: e => this.commit({ champs: Object.assign({}, s.champs, { NFC: e.target.value }), sbWinner: (s.sbWinner === s.champs.NFC ? \"\" : s.sbWinner) }),\n      onSb: e => this.commit({ sbWinner: e.target.value }),\n      onMvp: e => this.commit({ awards: Object.assign({}, s.awards, { mvp: e.target.value }) }),\n      onOpoy: e => this.commit({ awards: Object.assign({}, s.awards, { opoy: e.target.value }) }),\n      onDpoy: e => this.commit({ awards: Object.assign({}, s.awards, { dpoy: e.target.value }) }),\n      onRoty: e => this.commit({ awards: Object.assign({}, s.awards, { roty: e.target.value }) }),\n      onCoy: e => this.commit({ awards: Object.assign({}, s.awards, { coy: e.target.value }) })\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
